# The whole lab on one server, behind HTTPS:
#   https://idp.${DOMAIN}          Keycloak (admin console: /admin)
#   https://secretariat.${DOMAIN}  Secretariat
#   https://biblioteca.${DOMAIN}   Biblioteca
#   https://platformacursuri.${DOMAIN}  course platform of exercises 1-14 (local accounts, no Keycloak)
# Mailpit is not public: ssh -L 8025:127.0.0.1:8025 azureuser@<server>, then http://localhost:8025
# Secrets live in .env (created by ./init-env.sh, never committed).

name: universitate

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # Inside the network the public names point to Caddy too, so the apps reach
        # Keycloak (and each other) through the same HTTPS URLs as the browser.
        aliases:
          - idp.${DOMAIN}
          - secretariat.${DOMAIN}
          - biblioteca.${DOMAIN}
          - platformacursuri.${DOMAIN}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    # Production mode: strict hostname, plain HTTP only inside the network, TLS ends at Caddy.
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://idp.${DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./realm/realm-universitate.json:/opt/keycloak/data/import/realm-universitate.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  secretariat:
    build:
      context: ../..
      dockerfile: deploy/azure/Dockerfile
      args:
        APP: Secretariat.Web
    restart: unless-stopped
    environment:
      ConnectionStrings__Secretariat: Data Source=/data/secretariat.db
      Keycloak__Authority: https://idp.${DOMAIN}/realms/universitate
      Keycloak__ClientSecret: ${SECRETARIAT_CLIENT_SECRET}
      Keycloak__RequireHttpsMetadata: "true"
      KeycloakAdmin__BaseUrl: https://idp.${DOMAIN}/admin/realms/universitate/
      KeycloakAdmin__InvitationRedirectUri: https://secretariat.${DOMAIN}/
      KeycloakAdmin__AdminConsoleUrl: https://idp.${DOMAIN}/admin/master/console/
      Links__Secretariat: https://secretariat.${DOMAIN}/
      Links__Biblioteca: https://biblioteca.${DOMAIN}/
      Links__AdminConsole: https://idp.${DOMAIN}/admin/master/console/#/universitate
      Links__Mailpit: http://localhost:8025
    volumes:
      - secretariat-data:/data
      - secretariat-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      - keycloak

  biblioteca:
    build:
      context: ../..
      dockerfile: deploy/azure/Dockerfile
      args:
        APP: Biblioteca.Web
    restart: unless-stopped
    environment:
      ConnectionStrings__Biblioteca: Data Source=/data/biblioteca.db
      Keycloak__Authority: https://idp.${DOMAIN}/realms/universitate
      Keycloak__ClientSecret: ${BIBLIOTECA_CLIENT_SECRET}
      Keycloak__RequireHttpsMetadata: "true"
      SecretariatApi__BaseUrl: https://secretariat.${DOMAIN}/
      Links__Secretariat: https://secretariat.${DOMAIN}/
      Links__Biblioteca: https://biblioteca.${DOMAIN}/
    volumes:
      - biblioteca-data:/data
      - biblioteca-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      - keycloak

  cursuri:
    # The platform lives in another folder of the repository (01-autentificare-locala/platforma-cursuri).
    # On the server, where only this lab folder is copied, CURSURI_SRC in .env points to its copy.
    # It needs no database: courses, accounts and the simulated registry are seed data in memory.
    build:
      context: ${CURSURI_SRC:-../../../01-autentificare-locala/platforma-cursuri}
      args:
        DOMAIN: ${DOMAIN}
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build
        ARG DOMAIN
        WORKDIR /src
        COPY . .
        # The layout links the other two apps at their lab addresses; on the server they get the public ones.
        RUN sed -i "s#http://localhost:5001#https://secretariat.$${DOMAIN}#; s#http://localhost:5002#https://biblioteca.$${DOMAIN}#" Cursuri/Views/Shared/_Layout.cshtml \
         && dotnet publish Cursuri/Cursuri.csproj -c Release -o /out
        FROM mcr.microsoft.com/dotnet/aspnet:10.0
        WORKDIR /app
        COPY --from=build /out ./
        RUN mkdir -p /home/app/.aspnet/DataProtection-Keys && chown -R app:app /home/app/.aspnet
        USER app
        ENV ASPNETCORE_HTTP_PORTS=8080 ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
        EXPOSE 8080
        ENTRYPOINT ["dotnet", "Cursuri.dll"]
    restart: unless-stopped
    volumes:
      - cursuri-keys:/home/app/.aspnet/DataProtection-Keys

volumes:
  caddy-data:
  caddy-config:
  keycloak-db:
  secretariat-data:
  secretariat-keys:
  biblioteca-data:
  biblioteca-keys:
  cursuri-keys:
